<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 2100 2970" role="img" aria-labelledby="title desc">
  <title id="title">The Ferryman: monochrome prototype icon library</title>
  <desc id="desc">Ten original editable vector symbols with labels: oar, coin, Standing lantern, seat, memory, linked pair, wraith, Elysium, Asphodel, and Tartarus. A4 portrait sheet.</desc>
  <style>
    .label{font-family:Arial,sans-serif;font-size:37px;font-weight:700;letter-spacing:2px;fill:#142A30}.body{font-family:Arial,sans-serif;font-size:27px;fill:#142A30}.caption{font-family:Arial,sans-serif;font-size:25px;fill:#142A30}.frame{fill:none;stroke:#142A30;stroke-width:2}.symbol{fill:none;stroke:#142A30;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <symbol id="icon-oar" viewBox="0 0 120 120"><g class="symbol"><path d="M22 22L71 71M28 16L77 65M17 17L27 7L35 15L25 25Z"/><path d="M70 63L98 79Q116 95 101 108Q90 116 78 101L62 74Z"/><path d="M82 84L101 102"/></g></symbol>
