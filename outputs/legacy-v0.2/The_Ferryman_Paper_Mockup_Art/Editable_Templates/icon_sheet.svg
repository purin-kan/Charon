    <symbol id="icon-elysium" viewBox="0 0 120 120"><g class="symbol"><circle cx="60" cy="41" r="18"/><path d="M60 8V14M60 68V74M27 41H33M87 41H93M37 18L42 23M78 59L83 64M37 64L42 59M78 23L83 18M60 108Q14 88 19 49M60 108Q106 88 101 49"/><path d="M20 60L10 51M23 75L10 68M30 88L18 86M42 99L29 99M100 60L110 51M97 75L110 68M90 88L102 86M78 99L91 99"/></g></symbol>
