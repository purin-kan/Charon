    <symbol id="icon-standing" viewBox="0 0 120 120"><g class="symbol"><path d="M47 28V21Q47 8 60 8Q73 8 73 21V28M37 35L28 44H92L83 35ZM34 44V94L25 104H95L86 94V44M44 94H76M47 60Q60 48 73 60L73 78Q60 92 47 78Z"/><path d="M10 66H17M103 66H110M21 30L27 36M99 30L93 36"/></g></symbol>
    <symbol id="icon-seat" viewBox="0 0 120 120"><g class="symbol"><path d="M28 15H92V61H28ZM22 63H98V78H22ZM31 78V107M89 78V107M44 78V99M76 78V99M39 25V50M60 25V50M81 25V50"/></g></symbol>
    <symbol id="icon-memory" viewBox="0 0 120 120"><g class="symbol"><path d="M60 10L109 59L60 110L11 59ZM60 31L88 59L60 89L32 59Z"/><circle cx="60" cy="59" r="7"/></g></symbol>
    <symbol id="icon-linked" viewBox="0 0 120 120"><g class="symbol"><circle cx="31" cy="28" r="13"/><circle cx="89" cy="28" r="13"/><path d="M12 99V63Q31 41 50 63V99M70 99V63Q89 41 108 63V99M41 68L53 76Q60 81 67 76L79 68M24 66V97M96 66V97"/></g></symbol>
