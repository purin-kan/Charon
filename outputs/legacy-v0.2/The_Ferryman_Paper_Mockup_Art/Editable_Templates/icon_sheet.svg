  <g id="standing-tile"><rect x="120" y="835" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-standing" x="175" y="933" width="195" height="195"/><text x="430" y="1010" class="label">STANDING</text><text x="430" y="1061" class="body">Lantern resource symbol</text></g>
  <g id="seat-tile"><rect x="1080" y="835" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-seat" x="1135" y="933" width="195" height="195"/><text x="1390" y="1010" class="label">SEAT</text><text x="1390" y="1061" class="body">Boat capacity</text></g>
  <g id="memory-tile"><rect x="120" y="1290" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-memory" x="175" y="1388" width="195" height="195"/><text x="430" y="1465" class="label">MEMORY</text><text x="430" y="1516" class="body">Residue / remembered trace</text></g>
  <g id="linked-tile"><rect x="1080" y="1290" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-linked" x="1135" y="1388" width="195" height="195"/><text x="1390" y="1465" class="label">LINKED PAIR</text><text x="1390" y="1516" class="body">Related soul cards</text></g>
  <g id="wraith-tile"><rect x="120" y="1745" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-wraith" x="175" y="1843" width="195" height="195"/><text x="430" y="1920" class="label">WRAITH</text><text x="430" y="1971" class="body">Hooded soul state</text></g>
  <g id="elysium-tile"><rect x="1080" y="1745" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-elysium" x="1135" y="1843" width="195" height="195"/><text x="1390" y="1920" class="label">ELYSIUM</text><text x="1390" y="1971" class="body">Sun and laurel</text></g>
  <g id="asphodel-tile"><rect x="120" y="2200" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-asphodel" x="175" y="2298" width="195" height="195"/><text x="430" y="2375" class="label">ASPHODEL</text><text x="430" y="2426" class="body">Flower and stem</text></g>
  <g id="tartarus-tile"><rect x="1080" y="2200" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-tartarus" x="1135" y="2298" width="195" height="195"/><text x="1390" y="2375" class="label">TARTARUS</text><text x="1390" y="2426" class="body">Deep barred gate</text></g>
  <g id="sheet-footer">
    <path d="M120 2690H1980" class="frame"/>
    <text x="120" y="2750" class="caption">One ink colour. Distinct silhouettes. Copy each named symbol from the SVG definitions.</text>
    <text x="120" y="2798" class="caption">Prototype visual choices only. The team can rename, redraw, or replace any symbol.</text>
    <text x="120" y="2870" class="caption">A4 • 210 × 297 mm • Print at 100%</text>
    <text x="1980" y="2870" text-anchor="end" class="caption">EDITABLE VECTOR TEMPLATE</text>
  </g>
