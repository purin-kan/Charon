  <rect width="2100" height="2970" fill="#FFFFFF"/>
  <g id="sheet-heading">
    <text x="120" y="170" font-family="Georgia,serif" font-size="74" fill="#142A30">THE FERRYMAN</text>
    <text x="122" y="234" class="label">PAPER PROTOTYPE ICON LIBRARY</text>
    <path d="M120 280H1980" class="frame"/>
    <text x="120" y="325" class="caption">Original vector symbols • Pair every symbol with a word label</text>
  </g>
  <g id="oar-tile"><rect x="120" y="380" width="900" height="405" rx="18" class="frame"/><use xlink:href="#icon-oar" x="175" y="478" width="195" height="195"/><text x="430" y="555" class="label">OAR</text><text x="430" y="606" class="body">Crossing / boat action</text></g>
